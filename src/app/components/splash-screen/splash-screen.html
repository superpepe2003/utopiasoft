@if (visible()) {
  <div class="splash" [class.splash--fade]="fadeOut()">
    <div class="splash__bg">
      <div class="splash__orb splash__orb--1"></div>
      <div class="splash__orb splash__orb--2"></div>
      <div class="splash__orb splash__orb--3"></div>
    </div>
    <div class="splash__logo-wrap">
      <img class="splash__logo" src="assets/logo.png" alt="Utopia Soft" />
    </div>
  </div>
}
